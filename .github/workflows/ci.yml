name: CI

# Single required job. Per CONTRIBUTING.md, CI is the only opinion that
# counts at merge time — everything below is exactly what a contributor
# should run locally before opening a PR:
#
#   sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev mingw-w64
#   rustup target add x86_64-pc-windows-gnu
#   cargo check
#   cargo check --target x86_64-pc-windows-gnu
#   cargo clippy --all-targets -- -D warnings
#   cargo test
#
# (On Arch, swap the apt-get line for: pacman -S gtk3 webkit2gtk-4.1
# gtk-layer-shell mingw-w64-gcc — see CLAUDE.md for native builds.)
#
# `cargo fmt --check` is intentionally NOT wired in here: the codebase does
# not currently pass it, and adding a check that fails against existing code
# would just teach contributors to ignore red CI.

on:
  push:
    branches: [master, dev, test]
  pull_request:
    branches: [master, dev, test]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI deps + mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-layer-shell-dev \
            mingw-w64

      - name: Install Rust (stable, native + windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (native)
        run: cargo check

      - name: cargo check (windows-gnu cross-check)
        run: cargo check --target x86_64-pc-windows-gnu

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
